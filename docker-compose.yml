# PostgreSQL + Qdrant for local development.  Ollama runs natively on your machine
# (https://ollama.com) so that it can use your GPU.
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lce
      POSTGRES_PASSWORD: lce_password
      POSTGRES_DB: lce
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lce -d lce"]
      interval: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["16333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
volumes:
  pgdata:
  qdrantdata:
